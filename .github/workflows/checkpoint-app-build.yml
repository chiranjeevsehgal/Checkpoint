name: checkpoint-app-build

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkpoint-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: checkpoint-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies (legacy peer deps for cross-platform lockfile)
        run: npm ci --legacy-peer-deps

      - name: Quality gate
        run: npm run check && npm test

      - name: Generate Android project
        run: npx expo prebuild -p android --no-install

      - name: Build APK
        run: npm run build:android -- -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk checkpoint-debug-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-debug-app
          path: checkpoint-app/checkpoint-debug-app.apk
          retention-days: 7
