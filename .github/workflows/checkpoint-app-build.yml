name: checkpoint-app-build

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the rolling app-nightly release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: checkpoint-app-nightly
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkpoint-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: checkpoint-app/package-lock.json

      - name: Install dependencies (legacy peer deps for cross-platform lockfile)
        run: npm ci --legacy-peer-deps

      - name: Quality gate
        run: npm run check && npm test

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkpoint-app
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          tool-cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: checkpoint-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies (legacy peer deps for cross-platform lockfile)
        run: npm ci --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild -p android --no-install

      - name: Build APK
        run: |
          npm run build:android -- -PreactNativeArchitectures=${{ matrix.abi }}
          cp android/app/build/outputs/apk/release/app-release.apk \
            checkpoint-nightly-${{ matrix.abi }}.apk

      - name: Checksum
        run: sha256sum checkpoint-nightly-${{ matrix.abi }}.apk > checkpoint-nightly-${{ matrix.abi }}.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          retention-days: 1
          path: |
            checkpoint-app/checkpoint-nightly-${{ matrix.abi }}.apk
            checkpoint-app/checkpoint-nightly-${{ matrix.abi }}.apk.sha256

  publish:
    needs: build
    if: ${{ github.event_name == 'schedule' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-nightly
          name: Checkpoint app - nightly
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: dist/*
          body: |
            Nightly builds of the Checkpoint app (arm64-v8a, armeabi-v7a).

            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }} (${{ github.event_name }})
            - Date (UTC): ${{ env.BUILD_DATE }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Signed with the debug keystore; not Play Store ready.
            - Artifacts: arm64-v8a (64-bit ARM), armeabi-v7a (32-bit ARM).

            Install: `adb install -r checkpoint-nightly-<abi>.apk`
