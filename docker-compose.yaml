networks:
  backend:
    driver: bridge

volumes:
  kafka-data:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local
  ntfy-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks:
      - backend
    ports:
      - "${BIND_KAFKA:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    networks:
      - backend
    ports:
      - "${BIND_POSTGRES:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CHECKPOINT_REQUEST_PASSWORD: ${CHECKPOINT_REQUEST_PASSWORD:-checkpoint_request_password}
      CHECKPOINT_WORKER_PASSWORD: ${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}
      CHECKPOINT_MCP_PASSWORD: ${CHECKPOINT_MCP_PASSWORD:-checkpoint_mcp_password}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD:-kratos_db_password}
      TZ: Asia/Kolkata
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    command: >
      /bin/bash -c "ln -sf Kolkata /usr/share/zoneinfo/Asia/Calcutta && exec docker-entrypoint.sh postgres -c timezone=Asia/Kolkata"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    networks:
      - backend
    ports:
      - "${BIND_MINIO_API:-0.0.0.0}:9000:9000"
      - "${BIND_MINIO_CONSOLE:-127.0.0.1}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing minio/temp-audio;
      mc mb --ignore-existing minio/filtered-audio;
      mc mb --ignore-existing minio/audio;
      exit 0;
      "

  ingestion-migrate:
    build:
      context: ./ingestion-service
      target: migrate
    container_name: ingestion-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  ingestion-api:
    build:
      context: ./ingestion-service
      target: api
    container_name: ingestion-api
    networks:
      - backend
    ports:
      - "${BIND_INGESTION_API:-0.0.0.0}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ingestion-migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_REQUEST_URL: postgres://checkpoint_request:${CHECKPOINT_REQUEST_PASSWORD:-checkpoint_request_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_WORKER_URL: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: audio
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_TRANSCRIPTION: ${KAFKA_TOPIC_TRANSCRIPTION:-transcription.jobs.v1}
      KAFKA_CLIENT_ID: ingestion-api
      IDENTITY_TTL_HOURS: ${IDENTITY_TTL_HOURS:-1}
      IDENTITY_CLEANUP_INTERVAL_MINUTES: ${IDENTITY_CLEANUP_INTERVAL_MINUTES:-15}
      NTFY_PUBLIC_URL: ${NTFY_PUBLIC_URL:-http://localhost:8085}
      NTFY_ADMIN_URL: ${NTFY_ADMIN_URL:-http://ntfy:80}
      NTFY_ADMIN_TOKEN: ${NTFY_ADMIN_TOKEN:-}
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_TRANSCRIPTION: ${KAFKA_TOPIC_TRANSCRIPTION:-transcription.jobs.v1}
      KAFKA_TOPIC_EMBEDDING: ${KAFKA_TOPIC_EMBEDDING:-embedding.jobs.v1}
      KAFKA_TOPIC_EXTRACTION: ${KAFKA_TOPIC_EXTRACTION:-extraction.jobs.v1}
      KAFKA_TOPIC_RETRY: ${KAFKA_TOPIC_RETRY:-retry.jobs.v1}
    command: >
      /bin/bash -c "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_TRANSCRIPTION} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_TRANSCRIPTION}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EMBEDDING} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EMBEDDING}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EXTRACTION} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EXTRACTION}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_RETRY} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_RETRY}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      "

  transcription-migrate:
    build:
      context: ./transcription-service
      target: migrate
    container_name: transcription-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      # Migrations run one at a time: every service GRANTs USAGE on schema
      # public, and concurrent catalog writes fail with "tuple concurrently
      # updated" (SQLSTATE XX000).
      ingestion-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  transcription:
    build:
      context: ./transcription-service
      target: worker
    container_name: transcription
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      transcription-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      KAFKA_BROKERS: kafka:9092
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-elevenlabs}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped

  embedding-migrate:
    build:
      context: .
      dockerfile: embedding-service/Dockerfile
      target: migrate
    container_name: embedding-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      transcription-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  embedding:
    build:
      context: .
      dockerfile: embedding-service/Dockerfile
      target: worker
    container_name: embedding
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      embedding-migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_EMBEDDING: ${KAFKA_TOPIC_EMBEDDING:-embedding.jobs.v1}
      KAFKA_CONSUMER_GROUP: embedding-service
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_CHUNK_TOKENS: ${EMBEDDING_CHUNK_TOKENS:-1000}
      EMBEDDING_CHUNK_OVERLAP_TOKENS: ${EMBEDDING_CHUNK_OVERLAP_TOKENS:-100}
    restart: unless-stopped

  extraction-migrate:
    build:
      context: ./extraction-service
      target: migrate
    container_name: extraction-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      embedding-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  extraction:
    build:
      context: ./extraction-service
      target: worker
    container_name: extraction
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      extraction-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      KAFKA_BROKERS: kafka:9092
      GROQ_API_KEY: ${GROQ_API_KEY}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-}
      POSTGRES_DSN: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped

  rollup-migrate:
    build:
      context: ./rollup-service
      target: migrate
    container_name: rollup-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      extraction-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  rollup:
    build:
      context: ./rollup-service
      target: worker
    container_name: rollup
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      rollup-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      GROQ_API_KEY: ${GROQ_API_KEY}
      SUMMARIES_TIMEZONE: ${SUMMARIES_TIMEZONE:-}
      POSTGRES_DSN: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped

  notification-migrate:
    build:
      context: ./notification-service
      target: migrate
    container_name: notification-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      rollup-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  notification-service:
    build:
      context: ./notification-service
      target: worker
    container_name: notification-service
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      ingestion-migrate:
        condition: service_completed_successfully
      notification-migrate:
        condition: service_completed_successfully
      ntfy:
        condition: service_started
    environment:
      CONFIG_PATH: /app/config.yaml
      POSTGRES_DSN: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NTFY_TOKEN: ${NTFY_TOKEN:-tk_checkpointdevpublishtoken0001}
    restart: unless-stopped

  mcp-migrate:
    build:
      context: .
      dockerfile: mcp-service/Dockerfile
      target: migrate
    container_name: mcp-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CHECKPOINT_MCP_PASSWORD: ${CHECKPOINT_MCP_PASSWORD:-checkpoint_mcp_password}

  mcp-service:
    build:
      context: .
      dockerfile: mcp-service/Dockerfile
      target: worker
    container_name: mcp-service
    networks:
      - backend
    ports:
      - "${BIND_MCP:-127.0.0.1}:1417:1417"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-migrate:
        condition: service_completed_successfully
      kratos:
        condition: service_started
    environment:
      DATABASE_MCP_URL: postgres://checkpoint_mcp:${CHECKPOINT_MCP_PASSWORD:-checkpoint_mcp_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_WORKER_URL: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 1417
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:1417}
      MCP_TURBOVEC_BITS: ${MCP_TURBOVEC_BITS:-4}
      MCP_POLL_SECONDS: ${MCP_POLL_SECONDS:-30}
      MCP_FALLBACK_TIMEZONE: ${SUMMARIES_TIMEZONE:-Asia/Kolkata}
      MCP_MAX_TEXT_CHARS: ${MCP_MAX_TEXT_CHARS:-8000}
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      MCP_OAUTH_SESSION_SECRET: ${MCP_OAUTH_SESSION_SECRET:-}
      MCP_OAUTH_ACCESS_TTL_SECONDS: ${MCP_OAUTH_ACCESS_TTL_SECONDS:-3600}
      MCP_OAUTH_REFRESH_TTL_SECONDS: ${MCP_OAUTH_REFRESH_TTL_SECONDS:-2592000}
      MCP_OAUTH_ALLOWED_REDIRECT_HOSTS: ${MCP_OAUTH_ALLOWED_REDIRECT_HOSTS:-claude.ai,chatgpt.com}
    restart: unless-stopped

  retry-migrate:
    build:
      context: ./retry-service
      target: migrate
    container_name: retry-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      mcp-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  retry:
    build:
      context: ./retry-service
      target: worker
    container_name: retry
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      retry-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RETRY: ${KAFKA_TOPIC_RETRY:-retry.jobs.v1}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-1800}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-2}
      POSTGRES_DSN: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped


  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    networks:
      - backend
    ports:
      - "${BIND_NTFY:-0.0.0.0}:8085:80"
    volumes:
      - ntfy-data:/var/lib/ntfy
      - ./infra/ntfy/server.yml:/etc/ntfy/server.yml:ro
    environment:
      # Must match the client-facing host; override with the LAN IP for phones.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8085}
      # Provision the publisher/admin tokens from .env so ntfy and the app
      # services share one source of truth. Password hashes come from the env
      # too (dev defaults below are throwaway; set NTFY_*_PASS_HASH in prod).
      NTFY_AUTH_TOKENS: "checkpoint-admin:${NTFY_ADMIN_TOKEN:-tk_checkpointdevadmintoken000001},checkpoint-publisher:${NTFY_TOKEN:-tk_checkpointdevpublishtoken0001}"
      NTFY_AUTH_USERS: "checkpoint-admin:${NTFY_ADMIN_PASS_HASH:-$$2a$$10$$aQfjxeRdUQpcBTcPwotk/eAG02jiNi3Tv2hUi8rf6bCymkp7i7rYC}:admin,checkpoint-publisher:${NTFY_PUBLISHER_PASS_HASH:-$$2a$$10$$n0vDs6FF40KneoOAhNcVF.u5JU/4IJNLToo.PCCL8ykhq56Es2ZrK}:user"
    command: serve
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    networks:
      - backend
    ports:
      - "${BIND_MAILPIT_UI:-127.0.0.1}:8025:8025"
      - "${BIND_MAILPIT_SMTP:-127.0.0.1}:1025:1025"

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: kratos-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:-kratos_db_password}@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    restart: on-failure

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: kratos
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_KRATOS_PUBLIC:-0.0.0.0}:4433:4433"
      # Loopback-only so the local admin-console agent can reach the admin API
      # without exposing it to the network (Kratos admin has no auth of its own).
      - "${BIND_KRATOS_ADMIN:-127.0.0.1}:4434:4434"
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:-kratos_db_password}@postgres:5432/kratos?sslmode=disable
      # Public URL advertised in flow ui.action; must be reachable by the
      # client (a phone cannot resolve localhost). Override per environment.
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_BASE_URL:-http://localhost:4433/}
      # Outbound mail. Dev default stays Mailpit; production sets
      # KRATOS_SMTP_URI (e.g. Gmail SMTP) and KRATOS_SMTP_FROM_ADDRESS in .env.
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_URI:-smtp://mailpit:1025/?disable_starttls=true}
      COURIER_SMTP_FROM_ADDRESS: ${KRATOS_SMTP_FROM_ADDRESS:-noreply@example.com}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    restart: unless-stopped

  # TLS termination for the public MCP hostname. The OAuth authorization server
  # and the MCP resource server are the same mcp-service process, so all paths
  # proxy there. Requires ports 80/443 reachable from the internet for ACME.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    networks:
      - backend
    ports:
      - "${BIND_CADDY_HTTP:-0.0.0.0}:80:80"
      - "${BIND_CADDY_HTTPS:-0.0.0.0}:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mcp-service:
        condition: service_started
    restart: unless-stopped

  # --- Observability (opt-in) ---------------------------------------------
  # Start with: docker compose --profile observability up -d
  # Logs flow container stdout -> Alloy -> Loki; ingestion metrics are scraped
  # by Prometheus; Grafana reads both. All ports bind to loopback.
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    profiles: ["observability"]
    networks:
      - backend
    ports:
      - "${BIND_LOKI:-127.0.0.1}:3100:3100"
    # The image runs as uid 10001, which cannot read repo-mounted configs on
    # hosts whose parent dirs are not world-traversable. Run as root, matching
    # Grafana/Alloy, so the bind-mounted config and data volume are readable.
    user: "0:0"
    volumes:
      - loki-data:/loki
      - ./infra/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: alloy
    profiles: ["observability"]
    networks:
      - backend
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket so Alloy can discover and tail containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    profiles: ["observability"]
    networks:
      - backend
    ports:
      - "${BIND_PROMETHEUS:-127.0.0.1}:9090:9090"
    # The image runs as nobody (65534), which cannot read repo-mounted configs
    # on hosts whose parent dirs are not world-traversable. Run as root so the
    # bind-mounted config and TSDB volume are readable.
    user: "0:0"
    volumes:
      - prometheus-data:/prometheus
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    profiles: ["observability"]
    networks:
      - backend
    ports:
      - "${BIND_GRAFANA:-127.0.0.1}:3000:3000"
    # The image runs as uid 472, which cannot read repo-mounted provisioning on
    # hosts whose parent dirs are not world-traversable. Run as root, matching
    # Loki/Prometheus/Alloy, so datasources/dashboards/alerts provision.
    user: "0:0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Used by the provisioned ntfy contact point (see provisioning/alerting).
      NTFY_ALERT_TOKEN: ${NTFY_TOKEN:-tk_checkpointdevpublishtoken0001}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped