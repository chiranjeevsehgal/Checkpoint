networks:
  backend:
    driver: bridge

volumes:
  kafka-data:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks:
      - backend
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    networks:
      - backend
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CHECKPOINT_REQUEST_PASSWORD: ${CHECKPOINT_REQUEST_PASSWORD:-checkpoint_request_password}
      CHECKPOINT_WORKER_PASSWORD: ${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD:-kratos_db_password}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Kolkata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    command: >
      /bin/bash -c "ln -sf Kolkata /usr/share/zoneinfo/Asia/Calcutta && exec docker-entrypoint.sh postgres -c timezone=Asia/Kolkata"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - backend
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing minio/temp-audio;
      mc mb --ignore-existing minio/filtered-audio;
      mc mb --ignore-existing minio/audio;
      exit 0;
      "

  ingestion-migrate:
    build:
      context: ./ingestion-service
      target: migrate
    container_name: ingestion-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  ingestion-api:
    build:
      context: ./ingestion-service
      target: api
    container_name: ingestion-api
    networks:
      - backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ingestion-migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_REQUEST_URL: postgres://checkpoint_request:${CHECKPOINT_REQUEST_PASSWORD:-checkpoint_request_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_WORKER_URL: postgres://checkpoint_worker:${CHECKPOINT_WORKER_PASSWORD:-checkpoint_worker_password}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: audio
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_TRANSCRIPTION: ${KAFKA_TOPIC_TRANSCRIPTION:-transcription.jobs.v1}
      KAFKA_CLIENT_ID: ingestion-api
      IDENTITY_TTL_HOURS: ${IDENTITY_TTL_HOURS:-1}
      IDENTITY_CLEANUP_INTERVAL_MINUTES: ${IDENTITY_CLEANUP_INTERVAL_MINUTES:-15}
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_TRANSCRIPTION: ${KAFKA_TOPIC_TRANSCRIPTION:-transcription.jobs.v1}
      KAFKA_TOPIC_EMBEDDING: ${KAFKA_TOPIC_EMBEDDING:-embedding.jobs.v1}
      KAFKA_TOPIC_EXTRACTION: ${KAFKA_TOPIC_EXTRACTION:-extraction.jobs.v1}
    command: >
      /bin/bash -c "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_TRANSCRIPTION} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_TRANSCRIPTION}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EMBEDDING} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EMBEDDING}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EXTRACTION} --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $${KAFKA_TOPIC_EXTRACTION}.dlq --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1;
      "

  transcription-migrate:
    build:
      context: ./transcription-service
      target: migrate
    container_name: transcription-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  transcription:
    build:
      context: ./transcription-service
      target: worker
    container_name: transcription
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      transcription-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      KAFKA_BROKERS: kafka:9092
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-elevenlabs}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped

  embedding-migrate:
    build:
      context: ./embedding-service
      target: migrate
    container_name: embedding-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  embedding:
    build:
      context: ./embedding-service
      target: worker
    container_name: embedding
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      embedding-migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_EMBEDDING: ${KAFKA_TOPIC_EMBEDDING:-embedding.jobs.v1}
      KAFKA_CONSUMER_GROUP: embedding-service
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_CHUNK_TOKENS: ${EMBEDDING_CHUNK_TOKENS:-1000}
      EMBEDDING_CHUNK_OVERLAP_TOKENS: ${EMBEDDING_CHUNK_OVERLAP_TOKENS:-100}
    restart: unless-stopped

  extraction-migrate:
    build:
      context: ./extraction-service
      target: migrate
    container_name: extraction-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

  extraction:
    build:
      context: ./extraction-service
      target: worker
    container_name: extraction
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      extraction-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      KAFKA_BROKERS: kafka:9092
      GROQ_API_KEY: ${GROQ_API_KEY}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-}
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    networks:
      - backend
    ports:
      - "8025:8025"
      - "1025:1025"

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: kratos-migrate
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:-kratos_db_password}@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    restart: on-failure

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: kratos
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"
      # Loopback-only so the local admin-console agent can reach the admin API
      # without exposing it to the network (Kratos admin has no auth of its own).
      - "127.0.0.1:4434:4434"
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:-kratos_db_password}@postgres:5432/kratos?sslmode=disable
      # Public URL advertised in flow ui.action; must be reachable by the
      # client (a phone cannot resolve localhost). Override per environment.
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_BASE_URL:-http://localhost:4433/}
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    restart: unless-stopped