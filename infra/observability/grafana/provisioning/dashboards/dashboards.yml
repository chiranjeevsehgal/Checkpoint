# Loads the JSON dashboards baked into infra/observability/grafana/dashboards.
apiVersion: 1

providers:
  - name: checkpoint
    orgId: 1
    folder: Checkpoint
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
