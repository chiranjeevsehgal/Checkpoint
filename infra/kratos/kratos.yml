version: v1.3.1

# Recovery (code) does not complete for API/native clients without this: Kratos
# otherwise returns 422 browser_location_change_required and wants a settings
# redirect. With it, the recovery response carries continue_with so the app can
# read the session token and finish the settings flow.
feature_flags:
  use_continue_with_transitions: true

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-Session-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:4433/
  allowed_return_urls:
    - http://localhost:4433

  methods:
    password:
      enabled: true
      config:
        min_password_length: 12
        haveibeenpwned_enabled: true
        max_breaches: 0
        ignore_network_errors: true
        identifier_similarity_check_enabled: true
    totp:
      enabled: false
    webauthn:
      enabled: false
    code:
      enabled: true
    link:
      enabled: false
    oidc:
      enabled: false

  flows:
    error:
      ui_url: http://localhost:4433/error
    login:
      ui_url: http://localhost:4433/login
    registration:
      ui_url: http://localhost:4433/registration
      # One-step form matches the native app; profile_first appends a
      # two_step_registration hook this Kratos build logs as non-existing.
      style: unified
      after:
        password:
          hooks:
            # Kratos sends the registration verification code automatically.
            # show_verification_ui exposes that flow so the app submits the
            # code it already emailed instead of requesting a second one.
            - hook: session
            - hook: show_verification_ui
    verification:
      enabled: true
      use: code
      ui_url: http://localhost:4433/verification
      after:
        default_browser_return_url: http://localhost:4433/
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:4433/recovery
      after:
        default_browser_return_url: http://localhost:4433/
    settings:
      ui_url: http://localhost:4433/settings
      privileged_session_max_age: 5m
      required_aal: highest_available
      after:
        password:
          default_browser_return_url: http://localhost:4433/

log:
  level: info
  leak_sensitive_values: false

identity:
  default_schema_id: checkpoint
  schemas:
    - id: checkpoint
      url: file:///etc/config/kratos/identity.schema.json

session:
  lifespan: 720h

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
  # Overrides live under infra/kratos/templates, mounted with the config dir.
  template_override_path: /etc/config/kratos/templates
