@if (locked()) {
  <div class="app-shell">
    <div class="body">
      <main class="main">
        <div class="container unlock">
          <h1 class="page-title">Checkpoint Admin</h1>
          <p>This agent requires its token to continue.</p>
          @if (unlockError()) {
            <p class="error" role="alert">{{ unlockError() }}</p>
          }
          <div class="field">
            <label for="unlock-token">Agent token (ADMIN_TOKEN)</label>
            <input
              id="unlock-token"
              type="password"
              autocomplete="off"
              [value]="tokenInput()"
              (input)="tokenInput.set($any($event.target).value)"
              (keydown.enter)="unlock()"
            />
          </div>
          <button class="btn btn-primary" type="button" (click)="unlock()">Unlock</button>
        </div>
      </main>
    </div>
  </div>
} @else {
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Checkpoint<span>.</span>Admin</div>
    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="body">
    <header class="topbar">
      <h1 class="page-title">{{ title() }}</h1>
      <div class="topbar-actions">
        <span class="pill" [class.badge-primary]="busy()">{{ busy() ? 'Working…' : 'Idle' }}</span>
        <button class="btn btn-ghost" type="button" (click)="toggleTheme()">
          {{ dark() ? 'Light' : 'Dark' }}
        </button>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
}
